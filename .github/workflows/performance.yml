name: Automated Performance Test

on:
  workflow_dispatch:
  push:
  #schedule:
    #- cron: '*/15 * * * *'   # Every hour

jobs:
  performance-test:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - uses: actions/checkout@v4

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Performance Test
        run: |
          postman performance run "56639983-7d72ec11-0b96-4fe5-aa76-315f18ed523d" --vu-count 20 --duration 5 --load-profile ramp-up
