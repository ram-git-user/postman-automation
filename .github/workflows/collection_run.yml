name: API Production Validation

on:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Postman CLI
        run: postman --version

      - name: Run API Collection
        run: |
          postman collection run collection.json

      - name: Production Ready
        if: success()
        run: |
          echo "=========================================="
          echo "API TESTED SUCCESSFULLY"
          echo "READY TO MOVE TO PRODUCTION"
          echo "=========================================="

      - name: API Testing Failed
        if: failure()
        run: |
          echo "=========================================="
          echo "API TESTING FAILED"
          echo "NOT READY FOR PRODUCTION"
          echo "=========================================="
