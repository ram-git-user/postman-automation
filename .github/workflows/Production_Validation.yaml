name: API Production Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-test:
    runs-on: self-hosted

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Show Repository Files
      - name: Show Repository Files
        shell: powershell
        run: |
          Get-ChildItem

      # Find Latest Collection Version
      - name: Find Latest Collection
        shell: powershell
        run: |
          $latest = Get-ChildItem "collection_v*.json" |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1

          if ($null -eq $latest) {
              Write-Host "No collection_v*.json found."
              exit 1
          }

          Write-Host "Latest Collection Found:"
          Write-Host $latest.Name

          "LATEST_COLLECTION=$($latest.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Display Selected Collection
      - name: Display Selected Collection
        shell: powershell
        run: |
          Write-Host "Selected Collection: $env:LATEST_COLLECTION"

      # Verify Postman CLI
      - name: Verify Postman CLI
        run: postman --version

      # Execute Latest Collection
      - name: Execute Latest Collection
        shell: powershell
        run: |
          Write-Host "Running $env:LATEST_COLLECTION"
          postman collection run "$env:LATEST_COLLECTION"

      # Promote to Stable Collection
      - name: Promote Collection
        if: success()
        shell: powershell
        run: |
          Copy-Item "$env:LATEST_COLLECTION" "collection.json" -Force

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Promoted $env:LATEST_COLLECTION"
          Write-Host "to collection.json"
          Write-Host "=========================================="

      # Success Message
      - name: Production Ready
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " ALL API TESTS PASSED"
          Write-Host " collection.json updated locally"
          Write-Host " READY FOR PRODUCTION"
          Write-Host "=========================================="

      # Failure Message
      - name: Validation Failed
        if: failure()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " API TESTS FAILED"
          Write-Host " Existing collection.json retained"
          Write-Host " NOT READY FOR PRODUCTION"
          Write-Host "=========================================="
