name: API Production Validation

on:
  push:
    branches:
      - main
    paths:
      - 'collection.json'

  workflow_dispatch:

jobs:
  api-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verify Postman CLI
        run: postman --version

      - name: Execute Latest Collection
        run: postman collection run collection.json

      - name: Ready for Production
        if: success()
        run: |
          echo "=========================================="
          echo "ALL API TESTS PASSED"
          echo "READY FOR PRODUCTION"
          echo "=========================================="

      - name: Validation Failed
        if: failure()
        run: |
          echo "=========================================="
          echo "API TESTS FAILED"
          echo "NOT READY FOR PRODUCTION"
          echo "=========================================="
