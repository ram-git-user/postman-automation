name: API Production Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Latest Collection
        shell: powershell
        run: |
          $latest = Get-ChildItem "collection_v*.json" |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1

          if ($null -eq $latest) {
              Write-Host "No collection_v*.json found."
              exit 1
          }

          Write-Host "=========================================="
          Write-Host "Latest Collection: $($latest.Name)"
          Write-Host "=========================================="

          "LATEST_COLLECTION=$($latest.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Postman CLI
        run: postman --version

      - name: Execute Latest Collection
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Running Collection: $env:LATEST_COLLECTION"
          Write-Host "=========================================="

          postman collection run "$env:LATEST_COLLECTION"

      - name: Production Ready
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ALL API TESTS PASSED"
          Write-Host "READY FOR PRODUCTION"
          Write-Host "=========================================="

      - name: Validation Failed
        if: failure()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "API TESTS FAILED"
          Write-Host "NOT READY FOR PRODUCTION"
          Write-Host "=========================================="
